# configs/config.yaml

hydra:
  run:
    dir: outputs_meta/${now:%Y-%m-%d}/${model.name}_${data.target_labels}_${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: multirun_meta/${now:%Y-%m-%d}/${model.name}_${data.target_labels}_${now:%H-%M-%S}

defaults:
  - data: ds_with_metadata
  - target_labels: afib
  - model: model_with_metadata
  - train: train
  - optimizer: adam
  - criterion: cr
  - scheduler: scheduler
  - early_stopping: es
