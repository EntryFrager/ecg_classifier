# configs/config.yaml

hydra:
  run:
    dir: outputs_meta/${now:%Y-%m-%d}/${model.name}_${ds.target_labels}_${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: multirun_meta/${now:%Y-%m-%d}/${model.name}_${ds.target_labels}_${now:%H-%M-%S}

defaults:
  - dataset: ds
  - model: model
  - optimizer: adam
  - criterion: cr
  - scheduler: scheduler
  - early_stopping: es
