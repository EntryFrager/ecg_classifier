#ResNet.yaml

name: resnet

resnet:
    _target_: ecg_classifier.module.ResNetMeta
    block: ecg_classifier.module.BasicBlock
    layers: [2, 2, 2, 2]
    num_classes: 1
    drop_prob_head: 0.25
    drop_prob_backbone: 0.1
    num_classes_meta: 5
    drop_prob_meta: 0.1

train:
    batch_size: 128
    n_epoch: 50