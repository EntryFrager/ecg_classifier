#ResNet.yaml

name: ResNetMeta

ResNetMeta:
    _target_: ecg_classifier.module.ResNetMeta
    block: ecg_classifier.module.BasicBlock
    layers: [2, 2, 2, 2]
    in_channels: 12
    num_classes: 1
    drop_prob_head: 0.25
    drop_prob_backbone: 0.1
    in_channels_meta: 5
    drop_prob_meta: 0.1

train:
    batch_size: 64
    n_epoch: 30
    alpha: 0.7
    beta: 0.3